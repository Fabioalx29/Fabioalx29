
<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D19"/>
      <stop offset="0.55" stop-color="#101D38"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="glow" x1="650" y1="50" x2="1150" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>

    <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35" stroke="#60A5FA" stroke-opacity="0.07"/>
    </pattern>

    <filter id="blur">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>

  <!-- Blue lighting -->
  <ellipse cx="1030" cy="150" rx="230" ry="160"
    fill="#2563EB" fill-opacity="0.18" filter="url(#blur)"/>

  <path d="M730 300L1200 55V300H730Z" fill="url(#glow)"/>

  <!-- Decorative lines -->
  <path d="M0 265H1200" stroke="#60A5FA" stroke-opacity="0.12"/>
  <path d="M790 0L1000 300" stroke="#60A5FA" stroke-opacity="0.08"/>
  <path d="M850 0L1060 300" stroke="#60A5FA" stroke-opacity="0.06"/>

  <!-- Left content -->
  <rect x="65" y="65" width="4" height="35" rx="2" fill="#60A5FA"/>

  <text x="88" y="91" fill="#94A3B8"
    font-family="Arial, sans-serif" font-size="13" letter-spacing="4">
    HELLO, I'M
  </text>

  <text x="65" y="157" fill="#FFFFFF"
    font-family="Arial, sans-serif" font-size="49"
    font-weight="700" letter-spacing="-1.5">
    Fabio Alexsander
  </text>

  <text x="68" y="194" fill="#60A5FA"
    font-family="Arial, sans-serif" font-size="16"
    font-weight="600" letter-spacing="3">
    FRONT-END DEVELOPER
  </text>

  <text x="68" y="235" fill="#AAB8D0"
    font-family="Arial, sans-serif" font-size="14">
    React / TypeScript / JavaScript / Tailwind CSS
  </text>

  <!-- Code panel -->
  <rect x="825" y="68" width="305" height="165" rx="12"
    fill="#080D19" fill-opacity="0.65"
    stroke="#60A5FA" stroke-opacity="0.3"/>

  <circle cx="847" cy="88" r="4" fill="#EF4444"/>
  <circle cx="862" cy="88" r="4" fill="#F59E0B"/>
  <circle cx="877" cy="88" r="4" fill="#22C55E"/>

  <path d="M825 105H1130" stroke="#60A5FA" stroke-opacity="0.18"/>

  <text x="849" y="137" fill="#60A5FA"
    font-family="monospace" font-size="15">
    const developer = {
  </text>

  <text x="869" y="163" fill="#CBD5E1"
    font-family="monospace" font-size="14">
    name: "Fabio",
  </text>

  <text x="869" y="188" fill="#CBD5E1"
    font-family="monospace" font-size="14">
    focus: "Front-End",
  </text>

  <text x="849" y="214" fill="#60A5FA"
    font-family="monospace" font-size="15">
    };
  </text>

  <!-- Bottom accent -->
  <rect x="65" y="276" width="160" height="3" rx="1.5" fill="url(#line)"/>
  <rect x="235" y="276" width="35" height="3" rx="1.5" fill="#60A5FA" fill-opacity="0.3"/>

  <text x="1130" y="277" text-anchor="end"
    fill="#64748B" font-family="monospace"
    font-size="10" letter-spacing="2">
    PORTFOLIO / 2026
  </text>
</svg>

